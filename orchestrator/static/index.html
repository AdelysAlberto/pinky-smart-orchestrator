<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinky Smart Orchestrator Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ansi_up@5.1.0/ansi_up.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header Bar -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-lg font-bold tracking-tight text-white">PINKY SMART ORCHESTRATOR</h1>
      <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">Harness-Agnostic</span>
      <span id="laya-badge" class="text-xs px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800">Laya System 1: Activo</span>
    </div>

    <div class="flex items-center space-x-4">
      <button id="btn-pause" onclick="togglePause()" class="px-3 py-1.5 text-xs font-semibold rounded bg-amber-600/20 text-amber-300 hover:bg-amber-600/30 border border-amber-600/40 transition">
        Pausar Cola
      </button>
      <div id="connection-status" class="text-xs text-emerald-400 font-mono">Conectado</div>
    </div>
  </header>

  <!-- Main Work Area (Split View) -->
  <main class="flex-1 flex overflow-hidden">

    <!-- Left Column: Tasks Queue & Pipeline Stepper (35%) -->
    <section class="w-1/3 border-r border-slate-800 flex flex-col bg-slate-900/20">
      
      <!-- New Task Form -->
      <div class="p-4 border-b border-slate-800 bg-slate-900/40">
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Nueva Tarea (Cola FIFO)</label>
        <div class="flex flex-col space-y-2">
          <textarea id="task-input" rows="2" placeholder="Ej: Refactorizar autenticación o corregir bug en..." class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
          <div class="flex justify-between items-center">
            <select id="harness-select" class="bg-slate-950 border border-slate-800 text-xs rounded px-2 py-1 text-slate-300 focus:outline-none">
              <option value="pi">Harness: Pi</option>
              <option value="opencode">Harness: OpenCode</option>
              <option value="claude">Harness: Claude Code</option>
            </select>
            <button onclick="submitTask()" class="px-3 py-1 text-xs font-medium rounded bg-indigo-600 hover:bg-indigo-500 text-white transition">
              Encolar Tarea
            </button>
          </div>
        </div>
      </div>

      <!-- Active / Queued Tasks List -->
      <div class="flex-1 overflow-y-auto p-4 space-y-3" id="task-list">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Center/Right Column: Live Terminal & Markdown Split (65%) -->
    <section class="flex-1 flex flex-col overflow-hidden bg-slate-950">

      <!-- Active Step & Approval Gate Banner -->
      <div id="gate-banner" class="hidden border-b border-amber-500/40 bg-amber-500/10 p-3 px-6 flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-amber-400">PUERTA DE APROBACIÓN REQUERIDA</span>
          <p class="text-xs text-slate-300">Sheldon ha generado el plan técnico. Revisa y autoriza la fase de construcción.</p>
        </div>
        <div class="flex space-x-2">
          <button onclick="submitDecision(true)" class="px-4 py-1 text-xs font-bold rounded bg-emerald-600 hover:bg-emerald-500 text-white transition shadow">
            Aprobar Plan
          </button>
          <button onclick="submitDecision(false)" class="px-3 py-1 text-xs font-medium rounded bg-rose-600/30 text-rose-300 hover:bg-rose-600/50 border border-rose-600/50 transition">
            Rechazar
          </button>
        </div>
      </div>

      <!-- Tabs Navigation -->
      <div class="h-10 border-b border-slate-800 bg-slate-900/40 px-6 flex items-center justify-between text-xs">
        <div class="flex space-x-4">
          <button id="tab-terminal-btn" onclick="switchTab('terminal')" class="font-semibold text-indigo-400 border-b-2 border-indigo-500 pb-2.5">
            Consola Terminal PTY (En Vivo)
          </button>
          <button id="tab-plan-btn" onclick="switchTab('plan')" class="text-slate-400 hover:text-slate-200 pb-2.5">
            Plan Técnico (Markdown)
          </button>
        </div>
        <div id="active-agent-badge" class="text-slate-400 font-mono text-xs">
          Agente: Esperando...
        </div>
      </div>

      <!-- Tab Content Area -->
      <div class="flex-1 relative overflow-hidden">
        <!-- Terminal PTY View -->
        <div id="terminal-view" class="absolute inset-0 p-4 font-mono text-xs overflow-y-auto leading-relaxed text-slate-300 bg-slate-950 select-text">
          <div class="text-slate-500">// Esperando ejecución de tareas...</div>
        </div>

        <!-- Markdown Plan View -->
        <div id="markdown-view" class="hidden absolute inset-0 p-6 overflow-y-auto prose prose-invert prose-sm max-w-none bg-slate-900/30">
          <p class="text-slate-500 italic">No hay plan técnico cargado aún.</p>
        </div>
      </div>

    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
