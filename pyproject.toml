[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinky-orchestrator"
version = "1.0.3"
description = "Harness-agnostic, zero-Docker agent queue and execution engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "watchfiles>=0.24.0",
    "websockets>=12.0",
    "mcp>=2.2.0",
]

[project.scripts]
pinky = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
orchestrator = ["static/*", "agents/*", "rules/*", "skills/*"]
